class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelIndex = Phaser.Math.Clamp((data && data.level) || 0, 0, LEVELS.length - 1);
    this.level = LEVELS[this.levelIndex];
    this.worldW = this.level.width;
    this.state = 'intro';            // intro | loading | ready | aiming | flying | waiting | won | lost
    this.paused = false;
    this.score = 0; this.steps = 0; this.acc = 0;
    this.blocks = []; this.pigs = []; this.killQueue = [];
    this.queue = []; this.loadedBird = null; this.flyers = []; this.mainBird = null;
    this.birdsUsed = 0; this.resultShown = false; this.trailCount = 0;
    this.camCur = 0; this.camTarget = 0; this.pan = null; this.lastPan = -1e9; this.camManual = false;
    this.lastDust = 0; this.ui = null;
  }

  create() {
    this.time.paused = false;                // เผื่อกดเริ่มใหม่ขณะหยุดเกม (นาฬิกา/ทวีนของฉากค้างสถานะเดิม)
    this.tweens.resumeAll();
    Tex.ensureAll(this);
    this.bd = buildBackdrop(this, this.worldW);
    this.matter.add.rectangle(this.worldW / 2, GROUND_Y + 100, this.worldW + 4000, 200, {
      isStatic: true, label: 'ground', friction: 0.9, frictionStatic: 1, restitution: 0.1,
    });
    this.shadowG = this.add.graphics().setDepth(1);
    this.createSlingshot();
    this.buildLevel();
    this.setupInput();
    this.matter.world.on('collisionstart', this.onCollisionStart, this);

    this.onResize();
    this.scale.on('resize', this.onResize, this);
    this.events.once('shutdown', () => { this.scale.off('resize', this.onResize, this); this.scene.stop('UI'); });

    // กล้องเปิดฉาก: เริ่มที่ป้อม แล้วค่อยแพนกลับมาที่หนังสติ๊ก
    this.camCur = this.camTarget = this.camMax;
    this.applyCamera();
    this.time.delayedCall(1300, () => { this.camTarget = this.camMin; });
    this.time.delayedCall(2300, () => { if (this.state === 'intro') this.loadNextBird(); });
    this.scene.launch('UI', { mode: 'game', gs: this });
  }

  // ───── กล้อง / ขนาดจอ ─────
  onResize() {
    const f = cameraFit(this);
    this.viewW = f.viewW; this.viewH = f.viewH;
    const right = this.worldW + 60;
    this.camMin = WORLD_LEFT + this.viewW / 2;
    this.camMax = Math.max(this.camMin, right - this.viewW / 2);
    if (this.viewW >= right - WORLD_LEFT) this.camMin = this.camMax = (WORLD_LEFT + right) / 2;
    this.grabR = Math.max(CFG.sling.grabRadius, 46 * DPR / f.zoom);
    this.camCur = Phaser.Math.Clamp(this.camCur, this.camMin, this.camMax);
    this.camTarget = Phaser.Math.Clamp(this.camTarget, this.camMin, this.camMax);
    this.applyCamera();
  }
  applyCamera() { this.cameras.main.centerOn(this.camCur, WORLD_BOTTOM - this.viewH / 2); }
  updateCamera(dt) {
    const st = this.state;
    if (!this.pan) {
      if (st === 'flying') { const lead = this.leadBird(); if (lead) this.camTarget = lead.x + this.viewW * 0.1; }
      else if ((st === 'ready' || st === 'loading' || st === 'aiming') && (!this.camManual || this.time.now - this.lastPan > 2600)) {
        this.camTarget = this.camMin; this.camManual = false;
      }
      this.camTarget = Phaser.Math.Clamp(this.camTarget, this.camMin, this.camMax);
      const rate = st === 'flying' ? 5 : st === 'intro' ? 1.7 : 3;
      this.camCur += (this.camTarget - this.camCur) * (1 - Math.exp(-rate * dt / 1000));
    }
    this.applyCamera();
  }
  leadBird() { let best = null; for (const b of this.flyers) if (b.active && (!best || b.x > best.x)) best = b; return best; }

  // ───── ลูปหลัก: ฟิสิกส์ fixed timestep ─────
  update(time, delta) {
    if (!this.paused) {
      this.acc += Math.min(delta, 250);
      let n = 0;
      while (this.acc >= STEP_MS && n < 4) {
        this.matter.world.step(STEP_MS);
        this.afterStep();
        this.acc -= STEP_MS;
        n++;
      }
      if (n === 4) this.acc = 0;
    }
    this.updateCamera(delta);
    this.bd.update(delta);
    this.animateCharacters(time);
    this.drawShadows();
  }

  afterStep() {
    this.steps++;
    if (this.killQueue.length) {
      const q = this.killQueue; this.killQueue = [];
      q.forEach((go) => this.destroyEntity(go, 'hp'));
    }
    for (const go of this.pigs.slice()) if (go.x < WORLD_LEFT - 30 || go.x > this.worldW + 40 || go.y > WORLD_BOTTOM + 60) this.destroyEntity(go, 'oob');
    for (const go of this.blocks.slice()) if (go.x < -400 || go.x > this.worldW + 400 || go.y > WORLD_BOTTOM + 250) this.destroyEntity(go, 'oob');

    for (const b of this.flyers.slice()) {
      if (!b.active) continue;
      b.steps++;
      if (b === this.mainBird && !b.hit && b.steps % 3 === 0) this.addTrailDot(b.x, b.y);
      b.idle = b.body.speed < 0.35 ? b.idle + 1 : 0;
      const oob = b.x > this.worldW + 200 || b.x < WORLD_LEFT - 200 || b.y > WORLD_BOTTOM + 150;
      if (b.btype === 'boom' && b.hit && !b.exploded && b.steps - b.hitStep > 120) { this.explodeBird(b); continue; }
      if (oob || b.idle > 45 || b.steps > 600) {
        if (b.btype === 'boom' && !b.exploded && !oob && !b.abilityUsedByTap) this.explodeBird(b);
        else this.retireBird(b, !oob);
      }
    }
    if (this.state === 'flying' && this.flyers.length === 0) {
      this.state = 'waiting'; this.waitSteps = 0;
      this.ui && this.ui.setAbility(null);
    } else if (this.state === 'waiting') {
      this.waitSteps++;
      if ((this.waitSteps > 30 && this.isSettled()) || this.waitSteps > 240) this.afterSettle();
    }
  }

  // ───── สร้างฉาก / วัตถุ ─────
  createSlingshot() {
    img(this, SLING.x, GROUND_Y, 'sling_back').setOrigin(0.5, 1).setDepth(4);
    img(this, SLING.x, GROUND_Y, 'sling_front').setOrigin(0.5, 1).setDepth(9);
    this.bandBackG = this.add.graphics().setDepth(6);
    this.bandFrontG = this.add.graphics().setDepth(9.5);
    this.aimG = this.add.graphics().setDepth(3);
    this.trailG = this.add.graphics().setDepth(3);
    this.drawBands(null);
  }

  buildLevel() {
    const list = [];
    this.level.build(list);
    this.pigTotal = 0; this.blockTotal = 0;
    for (const d of list) {
      if (d.k === 'pig') { this.spawnPig(d); this.pigTotal += PIG_TYPES[d.type].score; }
      else if (MATERIALS[d.m].static) this.spawnTerrain(d);
      else { this.spawnBlock(d); this.blockTotal += MATERIALS[d.m].score; }
    }
    this.level.birds.forEach((t, i) => {
      const s = this.queueSlot(i, t);
      const im = img(this, s.x, s.y, `bird_${t}`).setDepth(8);
      Object.assign(im, { btype: t, texBase: `bird_${t}`, texBlink: `bird_${t}_blink`, blinkAt: 800 + Math.random() * 3000 });
      this.queue.push(im);
      this.idleHop(im, i);
    });
  }

  spawnTerrain(d) {
    const cy = GROUND_Y - d.y - d.h / 2;
    img(this, d.x, cy, Tex.block(this, d.m, d.w, d.h, 'rect', false)).setDepth(4);
    this.matter.add.rectangle(d.x, cy, d.w, d.h, { isStatic: true, label: 'terrain', friction: 0.9, frictionStatic: 1, restitution: 0.05 });
  }

  spawnBlock(d) {
    const M = MATERIALS[d.m];
    const o = { label: 'block', density: M.density, friction: M.friction, frictionStatic: 1, restitution: M.restitution };
    let cy = GROUND_Y - d.y - d.h / 2;
    if (d.shape === 'ball') { o.shape = { type: 'circle', radius: (d.w / 2) * TEX }; o.frictionAir = 0.008; }
    else if (d.shape === 'tri') {
      o.shape = { type: 'fromVerts', verts: [{ x: 0, y: d.h * TEX }, { x: (d.w / 2) * TEX, y: 0 }, { x: d.w * TEX, y: d.h * TEX }] };
      cy = GROUND_Y - d.y - d.h / 3;                        // จุดศูนย์ถ่วงสามเหลี่ยม
    }
    const go = this.matter.add.image(d.x, cy, Tex.block(this, d.m, d.w, d.h, d.shape, false), null, o);
    go.setScale(1 / TEX).setDepth(5);
    const area = d.shape === 'rect' ? d.w * d.h : d.shape === 'tri' ? (d.w * d.h) / 2 : (Math.PI * d.w * d.w) / 4;
    Object.assign(go, { kind: 'block', mat: d.m, shape: d.shape, bw: d.w, bh: d.h });
    go.maxHp = go.hp = M.hp * Phaser.Math.Clamp(Math.sqrt(area / 2000), 0.7, 1.6);
    this.blocks.push(go);
  }

  spawnPig(d) {
    const T = PIG_TYPES[d.type];
    const go = this.matter.add.image(d.x, GROUND_Y - d.y - T.r, Tex.pig(this, d.type, 'base'), null, {
      label: 'pig', shape: { type: 'circle', radius: T.r * TEX },
      density: T.density, friction: 0.9, frictionStatic: 1, restitution: 0.1, frictionAir: 0.01,
    });
    go.setScale(1 / TEX).setDepth(5);
    Object.assign(go, {
      kind: 'pig', pigType: d.type, texBase: Tex.pig(this, d.type, 'base'), texBlink: Tex.pig(this, d.type, 'blink'),
      texHurt: Tex.pig(this, d.type, 'hurt'), blinkAt: 600 + Math.random() * 3000,
    });
    go.maxHp = go.hp = T.hp;
    this.pigs.push(go);
  }

  queueSlot(i, type) { return { x: SLING.x - 64 - i * 38, y: GROUND_Y - BIRD_TYPES[type].r }; }
  idleHop(im, i) {
    this.tweens.add({ targets: im, y: GROUND_Y - BIRD_TYPES[im.btype].r - 10, duration: 220, yoyo: true, ease: 'Quad.easeOut', repeat: -1, repeatDelay: 1300 + i * 260 + Math.random() * 700 });
  }

  createBird(type, x, y) {
    const T = BIRD_TYPES[type];
    const b = this.matter.add.image(x, y, `bird_${type}`, null, {
      label: 'bird', shape: { type: 'circle', radius: T.r * TEX }, density: T.density, restitution: T.restitution,
      friction: 0.6, frictionAir: CFG.birdAir, collisionFilter: { group: -1 },         // นกไม่ชนกันเอง
    });
    b.setScale(1 / TEX).setDepth(8);
    Object.assign(b, { kind: 'bird', btype: type, steps: 0, idle: 0, hit: false, hitStep: 0, abilityUsed: true, exploded: false });
    return b;
  }

  // ───── หนังสติ๊ก ─────
  loadNextBird() {
    if (this.state === 'won' || this.state === 'lost' || !this.queue.length) return;
    const im = this.queue.shift();
    this.tweens.killTweensOf(im);
    this.state = 'loading';
    const sx = im.x, sy = GROUND_Y - BIRD_TYPES[im.btype].r;
    this.tweens.addCounter({
      from: 0, to: 1, duration: 440, ease: 'Sine.easeInOut',
      onUpdate: (tw) => {
        const t = tw.getValue();
        im.x = sx + (SLING.x - sx) * t;
        im.y = sy + (SLING.y - sy) * t - Math.sin(Math.PI * t) * 80;
        im.rotation = -0.6 * Math.sin(Math.PI * t);
      },
      onComplete: () => {
        im.setPosition(SLING.x, SLING.y).setRotation(0);
        this.loadedBird = im;
        this.drawBands(SLING.x, SLING.y);
        if (this.state === 'loading') { this.state = 'ready'; this.onBirdReady(im.btype); }
      },
    });
    this.queue.forEach((q, i) => {
      this.tweens.killTweensOf(q);
      const s = this.queueSlot(i, q.btype);
      this.tweens.add({ targets: q, x: s.x, y: s.y, duration: 300, delay: 150, onComplete: () => this.idleHop(q, i) });
    });
  }

  onBirdReady(type) {
    if (!this.ui) return;
    this.ui.setAbility(type, 'ready');
    if (BIRD_TYPES[type].ability && !Save.seen(type)) {
      Save.markSeen(type);
      this.ui.showNewBird(type);
    }
  }

  drawBands(bx, by) {
    const back = this.bandBackG.clear(), front = this.bandFrontG.clear();
    if (bx == null) { back.lineStyle(6, 0x3b1d0b).lineBetween(TIP_BACK.x, TIP_BACK.y, TIP_FRONT.x, TIP_FRONT.y); return; }
    let dx = bx - SLING.x, dy = by - SLING.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) { dx = -1; dy = 0; } else { dx /= len; dy /= len; }
    const px = bx + dx * 13, py = by + dy * 13;
    const thick = Math.max(4, 8 - len / 40);                              // ยางยืดมาก = เส้นบางลง
    back.lineStyle(thick, 0x3b1d0b).lineBetween(TIP_BACK.x, TIP_BACK.y, px, py);
    back.fillStyle(0x2a1407).fillCircle(px, py, 8);
    front.lineStyle(thick + 1, 0x4d2711).lineBetween(TIP_FRONT.x, TIP_FRONT.y, px, py);
  }

  drawAim(bx, by) {
    const g = this.aimG.clear();
    let vx = (SLING.x - bx) * CFG.sling.power, vy = (SLING.y - by) * CFG.sling.power, x = bx, y = by;
    const fa = 1 - CFG.birdAir;
    for (let i = 1; i <= 80; i++) {                                        // สมการเดียวกับ Matter (Verlet) → เส้นเล็งตรงกับของจริง
      vx *= fa; vy = vy * fa + GRAVITY_STEP; x += vx; y += vy;
      if (y > GROUND_Y || x > this.worldW) break;
      if (i % 4 === 0) {
        const a = Math.max(0.15, 0.95 - i / 90), rad = Math.max(2, 5.5 - i / 20);
        g.fillStyle(0x0b1d3a, a * 0.25).fillCircle(x + 1, y + 1.5, rad);
        g.fillStyle(0xffffff, a).fillCircle(x, y, rad);
      }
    }
  }

  addTrailDot(x, y) {
    this.trailCount++;
    const big = this.trailCount % 3 === 0;
    this.trailG.fillStyle(0xffffff, 0.9).fillCircle(x, y, big ? 4.5 : 2.5);
  }

  // ───── อินพุต ─────
  setupInput() {
    this.input.on('pointerdown', (p) => this.onDown(p));
    this.input.on('pointermove', (p) => this.onMove(p));
    this.input.on('pointerup', () => this.onUp());
    this.input.on('pointerupoutside', () => this.onUp());
    this.input.on('wheel', (p, over, dx, dy) => {
      if (['ready', 'loading', 'waiting'].includes(this.state)) {
        this.camManual = true; this.lastPan = this.time.now;
        this.camTarget = Phaser.Math.Clamp(this.camTarget + (dy + dx) * 0.9, this.camMin, this.camMax);
      }
    });
    const kb = this.input.keyboard;
    if (kb) {
      kb.on('keydown-R', () => this.restartLevel());
      kb.on('keydown-N', () => { if (this.resultShown && this.state === 'won') this.nextLevel(); });
      kb.on('keydown-M', () => this.toggleSound());
      kb.on('keydown-SPACE', () => { if (this.state === 'flying') this.useAbility(); });
      kb.on('keydown-ESC', () => { if (!this.resultShown) this.ui && this.ui.togglePause(); });
      kb.on('keydown-D', () => this.toggleDebug());
    }
  }

  onDown(p) {
    Sfx.unlock();
    if (this.paused) return;
    if (this.state === 'flying') { this.useAbility(); return; }
    if (this.state === 'ready' && this.loadedBird &&
        Phaser.Math.Distance.Between(p.worldX, p.worldY, this.loadedBird.x, this.loadedBird.y) <= this.grabR) {
      this.state = 'aiming'; this.camManual = false;
      this.ui && this.ui.hideHelp();
      Sfx.play('stretch');
      this.dragTo(p);
      return;
    }
    if (['ready', 'loading', 'waiting'].includes(this.state)) this.pan = { sx: p.x, c0: this.camCur };
  }
  onMove(p) {
    if (this.state === 'aiming') { this.dragTo(p); return; }
    if (this.pan && p.isDown) {
      const dx = (p.x - this.pan.sx) / this.cameras.main.zoom;
      if (Math.abs(dx) > 4) this.camManual = true;
      this.camCur = this.camTarget = Phaser.Math.Clamp(this.pan.c0 - dx, this.camMin, this.camMax);
      this.lastPan = this.time.now;
    }
  }
  onUp() {
    if (this.state === 'aiming') this.release();
    this.pan = null;
  }

  dragTo(p) {
    if (this.state !== 'aiming' || !this.loadedBird) return;
    let dx = p.worldX - SLING.x, dy = p.worldY - SLING.y;
    const len = Math.hypot(dx, dy);
    if (len > CFG.sling.maxPull) { dx *= CFG.sling.maxPull / len; dy *= CFG.sling.maxPull / len; }
    const r = BIRD_TYPES[this.loadedBird.btype].r;
    const bx = SLING.x + dx, by = Math.min(SLING.y + dy, GROUND_Y - r - 1);
    this.loadedBird.setPosition(bx, by);
    this.loadedBird.rotation = Math.atan2(SLING.y - by, SLING.x - bx);
    this.drawBands(bx, by);
    this.drawAim(bx, by);
  }

  release() {
    const b = this.loadedBird;
    if (!b) return;
    const pullX = SLING.x - b.x, pullY = SLING.y - b.y;
    this.aimG.clear();
    if (Math.hypot(pullX, pullY) < CFG.sling.minPull) {
      this.state = 'ready';
      b.setPosition(SLING.x, SLING.y).setRotation(0);
      this.drawBands(SLING.x, SLING.y);
      return;
    }
    this.launch(pullX, pullY);
  }

  launch(pullX, pullY) {
    const im = this.loadedBird;
    this.loadedBird = null;
    const type = im.btype, x = im.x, y = im.y, rot = im.rotation;
    im.destroy();
    const b = this.createBird(type, x, y);
    b.setRotation(rot);
    b.setVelocity(pullX * CFG.sling.power, pullY * CFG.sling.power);
    b.abilityUsed = !BIRD_TYPES[type].ability;
    this.flyers = [b]; this.mainBird = b;
    this.birdsUsed++;
    this.trailG.clear(); this.trailCount = 0;
    this.state = 'flying';
    this.drawBands(null);
    Sfx.play('launch');
    this.ui && this.ui.setAbility(b.abilityUsed ? null : type, 'flying');
  }

  // ───── ความสามารถพิเศษของนก ─────
  /** 🔧 ต่อยอด: เพิ่ม case ใหม่ตาม BIRD_TYPES[x].ability */
  useAbility() {
    const b = this.mainBird;
    if (!b || !b.active || b.abilityUsed) return;
    const T = BIRD_TYPES[b.btype];
    if (!T.ability) return;
    b.abilityUsed = true;
    this.ui && this.ui.setAbility(null);
    const v = b.body.velocity, sp = Math.hypot(v.x, v.y) || 1, ang = Math.atan2(v.y, v.x);
    if (T.ability === 'dash') {
      const ns = Math.min(30, Math.max(sp * 2.1, 20));
      b.setVelocity(Math.cos(ang) * ns, Math.sin(ang) * ns);
      b.dashing = true;
      const em = this.add.particles(0, 0, 'streak', {
        follow: b, lifespan: 260, frequency: 22, speed: 0, alpha: { start: 0.9, end: 0 },
        scale: { start: 1.3 / TEX, end: 0.4 / TEX }, rotate: { onEmit: () => Phaser.Math.RadToDeg(Math.atan2(b.body ? b.body.velocity.y : 0, b.body ? b.body.velocity.x : 1)) },
      }).setDepth(7);
      b.emitter = em;
      this.time.delayedCall(700, () => { if (em.active) { em.stop(); em.stopFollow(); } });
      this.time.delayedCall(1100, () => em.destroy());
      this.burst('puff', b.x, b.y, 6, { smin: 40, smax: 120, gravity: 0, scale: 1.2 });
      Sfx.play('dash');
    } else if (T.ability === 'split') {
      const px = -Math.sin(ang), py = Math.cos(ang);
      for (const s of [-1, 1]) {
        const a = ang + s * 0.22, off = (T.r * 2 + 4) * s;
        const nb = this.createBird(b.btype, b.x + px * off, b.y + py * off);
        nb.setVelocity(Math.cos(a) * sp * 1.05, Math.sin(a) * sp * 1.05);
        this.flyers.push(nb);
      }
      this.burst('puff', b.x, b.y, 8, { smin: 40, smax: 140, gravity: 0, scale: 1.3 });
      this.burst('feather', b.x, b.y, 6, { smin: 60, smax: 160, gravity: 200 });
      Sfx.play('split');
    } else if (T.ability === 'boom') {
      b.abilityUsedByTap = true;
      this.explodeBird(b);
    }
  }

  explodeBird(b) {
    if (b.exploded) return;
    b.exploded = true;
    const x = b.x, y = b.y;
    this.retireBird(b, false);
    this.explode(x, y, CFG.explosion);
  }

  retireBird(b, effect = true) {
    Phaser.Utils.Array.Remove(this.flyers, b);
    if (b.emitter && b.emitter.active) { b.emitter.stopFollow(); b.emitter.stop(); }
    if (effect && b.active) {
      this.burst('puff', b.x, b.y, 8, { smin: 30, smax: 120, gravity: -40, scale: 1.4 });
      this.burst('feather', b.x, b.y, 7, { smin: 60, smax: 180, gravity: 200 });
      Sfx.play('poof');
    }
    if (b.active) b.destroy();
    this.wakeAll();
  }

  /** ระเบิด: ผลักทุกชิ้นออกจากจุดศูนย์กลาง + ความเสียหายตามระยะ (ใช้กับนกประทัดและลัง TNT) */
  explode(x, y, o) {
    const MJ = Phaser.Physics.Matter.Matter;
    for (const go of this.blocks.concat(this.pigs)) {
      if (!go.active || go.dead) continue;
      const dx = go.x - x, dy = go.y - y, d = Math.hypot(dx, dy);
      const size = go.kind === 'pig' ? PIG_TYPES[go.pigType].r : Math.max(go.bw, go.bh) / 2;
      const reach = o.radius + size * 0.5;
      if (d > reach) continue;
      const k = Phaser.Math.Clamp(1 - d / reach, 0, 1);
      const nx = d > 1 ? dx / d : 0, ny = d > 1 ? dy / d : -1;
      const body = go.body;
      MJ.Sleeping.set(body, false);
      const dv = Math.min(24, (o.force * k) / Math.sqrt(Math.max(body.mass, 0.6)));
      MJ.Body.setVelocity(body, { x: body.velocity.x + nx * dv, y: body.velocity.y + ny * dv - 1.5 * k });
      MJ.Body.setAngularVelocity(body, body.angularVelocity + (Math.random() - 0.5) * 0.25 * k);
      this.damage(go, o.damage * k);
    }
    this.fxExplosion(x, y, o.radius);
    Sfx.play('boom');
    this.wakeAll();
  }

  afterSettle() {
    if (this.state !== 'waiting' || this.pigs.length === 0) return;
    if (this.queue.length) this.loadNextBird();
    else { this.state = 'lost'; this.time.delayedCall(700, () => this.showLose()); }
  }

  isSettled() {
    for (const go of this.blocks.concat(this.pigs)) {
      const b = go.body;
      if (!b || b.isSleeping) continue;
      if (b.speed > 0.15 || b.angularSpeed > 0.01) return false;
    }
    return true;
  }

  wakeAll() {
    const Sleeping = Phaser.Physics.Matter.Matter.Sleeping;
    for (const go of this.blocks.concat(this.pigs)) if (go.body && go.body.isSleeping) Sleeping.set(go.body, false);
  }

  // ───── การชน & ความเสียหาย ─────
  onCollisionStart(event) {
    for (const pair of event.pairs) {
      const A = pair.bodyA.parent, B = pair.bodyB.parent;
      const ga = A.gameObject, gb = B.gameObject;
      if (ga && ga.kind === 'bird') this.markBirdHit(ga);
      if (gb && gb.kind === 'bird') this.markBirdHit(gb);
      if (this.steps < CFG.damage.graceSteps) continue;
      const n = pair.collision.normal;
      const rel = Math.abs((A.velocity.x - B.velocity.x) * n.x + (A.velocity.y - B.velocity.y) * n.y);
      if (rel < CFG.damage.threshold) continue;
      this.applyImpact(A, B, rel);
      this.applyImpact(B, A, rel);
      if (rel > 2.5) Sfx.play('hit', rel / 12);
      const floor = A.isStatic || B.isStatic;
      if (floor && rel > 4.5 && this.time.now - this.lastDust > 70) {
        const s = pair.collision.supports && pair.collision.supports[0];
        if (s) { this.lastDust = this.time.now; this.burst('dust', s.x, s.y, 6, { smin: 20, smax: 100, gravity: -20, scale: 1.3, endScale: 2.2, alpha: 0.75, amin: 180, amax: 360, life: [500, 900] }); }
      }
    }
  }

  markBirdHit(b) {
    if (b.hit) return;
    b.hit = true; b.hitStep = b.steps;
    if (b === this.mainBird && !b.abilityUsed && b.btype !== 'boom') {  // ชนแล้วหมดสิทธิ์พุ่ง/แยกร่าง (ยกเว้นนกประทัด)
      b.abilityUsed = true;
      this.ui && this.ui.setAbility(null);
    }
  }

  /** ความเสียหาย ∝ การเปลี่ยนความเร็ว (Δv) ที่วัตถุได้รับ — ของเบาโดนของหนักพังง่าย, ตกกระแทกพื้นเจ็บเต็มๆ */
  applyImpact(self, other, rel) {
    const go = self.gameObject;
    if (!go || go.dead || !go.maxHp) return;
    const ratio = other.isStatic ? 1 : other.mass / (self.mass + other.mass);
    const dv = rel * ratio;
    let mult = 1;
    const og = other.gameObject;
    if (og && og.kind === 'bird') {
      const vs = BIRD_TYPES[og.btype].vs[go.kind === 'pig' ? 'pig' : go.mat] || 1;
      mult = CFG.damage.birdMultiplier * vs * (og.dashing ? 1.3 : 1);
    }
    this.damage(go, (dv - CFG.damage.threshold) * CFG.damage.scale * mult);
  }

  damage(go, amount) {
    if (!go || go.dead || !go.maxHp || amount <= 0) return;
    go.hp -= amount;
    if (go.hp <= 0) { go.dead = true; this.killQueue.push(go); }
    else this.updateDamageLook(go);
  }

  updateDamageLook(go) {
    if (go.kind === 'block' && !go.cracked && go.hp < go.maxHp * 0.5) {
      go.cracked = true;
      go.setTexture(Tex.block(this, go.mat, go.bw, go.bh, go.shape, true));
    } else if (go.kind === 'pig' && !go.hurt && go.hp < go.maxHp * 0.6) {
      go.hurt = true;
      go.setTexture(go.texHurt);
    }
  }

  destroyEntity(go, reason) {
    if (!go || !go.active) return;
    const x = go.x, y = go.y, kind = go.kind;
    let boom = false;
    if (kind === 'pig') {
      Phaser.Utils.Array.Remove(this.pigs, go);
      const T = PIG_TYPES[go.pigType];
      this.addScore(T.score, x, y - 14, '#b6ff7a', go.pigType === 'boss' ? 44 : 34);
      this.burst('puff_green', x, y, 16, { smin: 40, smax: 220, gravity: -30, scale: 1.7 });
      this.burst('puff', x, y, 6, { smin: 20, smax: 90, gravity: -60, scale: 1.2 });
      if (go.pigType === 'helmet') this.burst('chip_metal', x, y - 10, 6, { smin: 80, smax: 220 });
      Sfx.play('pig');
      if (go.pigType === 'boss') this.cameras.main.shake(260, 0.007);
    } else {
      Phaser.Utils.Array.Remove(this.blocks, go);
      if (reason !== 'oob') {
        const M = MATERIALS[go.mat];
        this.addScore(M.score, x, y, M.popup, 22);
        this.burst(M.chip, x, y, Math.min(26, 8 + Math.round((go.bw * go.bh) / 300)));
        if (M.sfx) Sfx.play(M.sfx);
        if (go.mat === 'stone' || go.mat === 'metal') this.cameras.main.shake(110, 0.003);
        boom = !!M.explosive;
      }
    }
    go.destroy();
    if (boom) this.explode(x, y, CFG.tnt);           // ลัง TNT ระเบิดต่อเป็นลูกโซ่ได้
    this.wakeAll();
    this.ui && this.ui.setPigs(this.pigs.length);
    if (kind === 'pig' && this.pigs.length === 0) this.onAllPigsDead();
  }

  // ───── ภาพ / เอฟเฟกต์ ─────
  animateCharacters(time) {
    for (const p of this.pigs) {
      if (p.hurt || time < p.blinkAt) continue;
      p.blinking = !p.blinking;
      p.setTexture(p.blinking ? p.texBlink : p.texBase);
      p.blinkAt = time + (p.blinking ? 140 : 1800 + Math.random() * 3400);
    }
    const birds = this.loadedBird ? this.queue.concat([this.loadedBird]) : this.queue;
    for (const b of birds) {
      if (time < b.blinkAt) continue;
      b.blinking = !b.blinking;
      b.setTexture(b.blinking ? b.texBlink : b.texBase);
      b.blinkAt = time + (b.blinking ? 130 : 2000 + Math.random() * 3000);
    }
  }

  drawShadows() {
    const g = this.shadowG.clear();
    const shadow = (cx, w, bottom) => {
      const hgt = GROUND_Y - bottom;
      if (hgt < -6 || hgt > 170) return;
      const a = 0.24 * (1 - Math.max(0, hgt) / 170);
      g.fillStyle(0x0f2a0c, a).fillEllipse(cx, GROUND_Y + 3, w * (1 - Math.max(0, hgt) / 420) + 8, 9);
    };
    for (const o of this.blocks.concat(this.pigs, this.flyers)) {
      if (!o.active || !o.body) continue;
      const bd = o.body.bounds;
      shadow((bd.min.x + bd.max.x) / 2, bd.max.x - bd.min.x, bd.max.y);
    }
    for (const q of this.queue) shadow(q.x, BIRD_TYPES[q.btype].r * 2, q.y + BIRD_TYPES[q.btype].r);
    shadow(SLING.x, 26, GROUND_Y);
  }

  addScore(points, x, y, color, size) {
    this.score += points;
    this.ui && this.ui.setScore(this.score);
    const res = Math.min(4, Math.max(2, Math.ceil(this.cameras.main.zoom * 1.2)));
    const t = txt(this, x, y, fmt(points), size, color, { weight: 800, stroke: '#0b1d3a', st: 6, res }).setOrigin(0.5).setDepth(40);
    t.setScale(0.6);
    this.tweens.add({ targets: t, scale: 1, duration: 180, ease: 'Back.easeOut' });
    this.tweens.add({ targets: t, y: y - 70, alpha: 0, delay: 350, duration: 900, ease: 'Cubic.easeOut', onComplete: () => t.destroy() });
  }

  burst(key, x, y, count, o = {}) {
    const sc = (o.scale ?? 1) / TEX;
    const life = o.life || [500, 1000];
    const em = this.add.particles(0, 0, key, {
      speed: { min: o.smin ?? 90, max: o.smax ?? 320 },
      angle: { min: o.amin ?? 0, max: o.amax ?? 360 },
      rotate: { min: 0, max: 360 },
      gravityY: o.gravity ?? 700,
      lifespan: { min: life[0], max: life[1] },
      scale: { start: sc, end: sc * (o.endScale ?? 0.2) },
      alpha: { start: o.alpha ?? 1, end: 0 },
      blendMode: o.add ? 'ADD' : 'NORMAL',
      emitting: false,
    }).setDepth(o.depth ?? 20);
    em.explode(count, x, y);
    this.time.delayedCall(life[1] + 300, () => em.destroy());
  }

  fxExplosion(x, y, R) {
    const flash = this.add.image(x, y, 'flash').setDepth(30).setScale((R / 64) * 0.5 / TEX).setBlendMode(Phaser.BlendModes.ADD);
    this.tweens.add({ targets: flash, scale: (R / 64) * 1.7 / TEX, alpha: 0, duration: 340, ease: 'Cubic.easeOut', onComplete: () => flash.destroy() });
    const ring = this.add.graphics().setDepth(29), o = { t: 0 };
    this.tweens.add({
      targets: o, t: 1, duration: 420, ease: 'Cubic.easeOut',
      onUpdate: () => ring.clear().lineStyle(10 * (1 - o.t) + 1, 0xfff1c4, 0.9 * (1 - o.t)).strokeCircle(x, y, R * o.t),
      onComplete: () => ring.destroy(),
    });
    this.burst('fire', x, y, 18, { smin: 60, smax: 280, gravity: -80, scale: 1.5, endScale: 0.6, life: [280, 650], add: true, depth: 28 });
    this.burst('smoke', x, y, 14, { smin: 30, smax: 170, gravity: -50, scale: 1.6, endScale: 2.4, alpha: 0.8, life: [800, 1500], depth: 27 });
    this.burst('spark', x, y, 22, { smin: 220, smax: 560, gravity: 600, add: true, depth: 28 });
    this.cameras.main.shake(320, 0.011);
  }

  // ───── ชนะ / แพ้ / เปลี่ยนด่าน ─────
  onAllPigsDead() {
    if (this.resultShown || this.state === 'won') return;
    this.state = 'won';
    this.aimG.clear();
    if (this.loadedBird) { this.loadedBird.setPosition(SLING.x, SLING.y).setRotation(0); this.drawBands(SLING.x, SLING.y); }
    this.ui && this.ui.setAbility(null);
    this.time.delayedCall(1500, () => this.winSequence());
  }

  winSequence() {
    const left = [this.loadedBird, ...this.queue].filter(Boolean);
    if (left.length) { this.camManual = false; this.camTarget = this.camMin; }
    left.forEach((im, i) => {
      this.time.delayedCall(500 + i * 420, () => {
        this.tweens.killTweensOf(im);
        this.addScore(CFG.birdBonus, im.x, im.y - 34, '#ffd66b', 30);
        this.burst('spark', im.x, im.y, 12, { smin: 60, smax: 180, gravity: 200, add: true });
        Sfx.play('bonus');
        im.setAlpha(0.35);
      });
    });
    this.time.delayedCall(left.length * 420 + (left.length ? 1100 : 300), () => this.showWin());
  }

  starsEarned() {
    const t2 = this.pigTotal + this.blockTotal * 0.35 + 5000;
    const t3 = this.pigTotal + this.blockTotal * 0.6 + 15000;
    return 1 + (this.score >= t2 ? 1 : 0) + (this.score >= t3 ? 1 : 0);
  }

  showWin() {
    if (this.resultShown) return;
    this.resultShown = true;
    const stars = this.starsEarned();
    const prev = Save.best(this.levelIndex).score;
    const isNew = Save.record(this.levelIndex, stars, this.score);
    Sfx.play('win');
    this.ui && this.ui.showResult({ win: true, stars, score: this.score, best: Math.max(prev, this.score), isNew, last: this.levelIndex === LEVELS.length - 1 });
  }

  showLose() {
    if (this.resultShown || this.pigs.length === 0) return;
    this.resultShown = true;
    Sfx.play('lose');
    this.ui && this.ui.showResult({ win: false, pigsLeft: this.pigs.length, score: this.score });
  }

  nextLevel() {
    if (this.levelIndex >= LEVELS.length - 1) this.goMenu(true);
    else this.scene.start('Game', { level: this.levelIndex + 1 });
  }
  restartLevel() { this.scene.start('Game', { level: this.levelIndex }); }
  playLevel(i) { this.scene.start('Game', { level: i }); }
  goMenu(select) { this.scene.start('Title', { select: !!select }); }

  setPaused(p) {
    this.paused = p;
    this.time.paused = p;
    if (p) this.tweens.pauseAll(); else this.tweens.resumeAll();
  }
  toggleSound() { Sfx.enabled = !Sfx.enabled; this.ui && this.ui.refreshSound(); }
  toggleDebug() {
    const w = this.matter.world;
    if (!w.debugGraphic) w.createDebugGraphic();
    w.drawDebug = !w.drawDebug;
    w.debugGraphic.clear();
  }
}

// ───── ชั้น UI (HUD / เมนู / ป๊อปอัป) — แยกกล้อง ไม่ซูมตามโลก ─────
class UIScene extends Phaser.Scene {
  constructor() { super('UI'); }
  init(d) { this.mode = d.mode; this.gs = d.gs; this.modal = null; this.fsState = null; this.cards = []; this.shownScore = 0; }

  create() {
    this.gs.ui = this;
    if (this.mode === 'menu') this.buildMenu(); else this.buildHUD();
    this.layout();
    this.scale.on('resize', this.layout, this);
    this.events.once('shutdown', () => { this.scale.off('resize', this.layout, this); if (this.gs && this.gs.ui === this) this.gs.ui = null; });
    if (this.mode === 'menu' && this.gs.openSelect) this.showLevelSelect();
  }

  update() {
    const fs = FS.active();
    if (fs !== this.fsState) { this.fsState = fs; if (this.fsBtn) this.fsBtn.redraw(fs); }
  }

  topRightButtons(kinds) {
    const c = this.add.container();
    let x = -30;
    for (const k of kinds) {
      if (k === 'fs' && !FS.available) continue;
      const cb = { fs: () => FS.toggle(), sound: () => this.toggleSound(), restart: () => this.gs.restartLevel(), pause: () => this.togglePause(), menu: () => this.gs.goMenu(false), exit: () => { location.href = 'index.html'; } }[k];
      const b = makeIconButton(this, x, 30, (k === 'menu' || k === 'exit') ? 'home' : k, cb, k === 'sound' ? Sfx.enabled : FS.active());
      if (k === 'fs') this.fsBtn = b;
      if (k === 'sound') this.soundBtn = b;
      c.add(b);
      x -= 64;
    }
    c.leftEdge = x + 30;
    return c;
  }
  toggleSound() { Sfx.enabled = !Sfx.enabled; this.refreshSound(); }
  refreshSound() { if (this.soundBtn) this.soundBtn.redraw(Sfx.enabled); }

  // ───── HUD ระหว่างเล่น ─────
  buildHUD() {
    const gs = this.gs, best = Save.best(gs.levelIndex).score;
    this.tl = this.add.container();
    const g = this.add.graphics(); glassPanel(g, 0, 0, 410, 100, 20);
    this.tl.add(g);
    this.tl.add(txt(this, 18, 8, `ด่าน ${gs.levelIndex + 1} · ${gs.level.name}`, 24, '#ffd66b', { weight: 600 }).setOrigin(0, 0));
    this.scoreText = txt(this, 18, 44, 'คะแนน 0', 28, '#ffffff', { weight: 800 }).setOrigin(0, 0);
    this.tl.add(this.scoreText);
    this.tl.add(txt(this, 394, 52, best ? `สถิติ ${fmt(best)}` : '', 18, '#bcd6ff').setOrigin(1, 0));

    this.tr = this.topRightButtons(['exit', 'fs', 'sound', 'restart', 'pause']);
    const pill = this.add.graphics(); const pw = 132, px = this.tr.leftEdge - 14 - pw;
    glassPanel(pill, px, 2, pw, 56, 28);
    this.tr.add(pill);
    this.tr.add(img(this, px + 34, 30, Tex.pig(this, 'normal', 'base')).setScale(0.62 / TEX));
    this.pigText = txt(this, px + 60, 30, `× ${gs.pigs.length}`, 26, '#b6ff7a', { weight: 800 }).setOrigin(0, 0.5);
    this.tr.add(this.pigText);
    this.trWidth = -px;

    this.abil = this.add.container().setVisible(false);
    this.abilBg = this.add.graphics();
    this.abilIcon = img(this, 0, 0, 'bird_pilot');
    this.abilText = txt(this, 0, 0, '', 21, '#ffffff', { weight: 600 }).setOrigin(0, 0.5);
    this.abil.add([this.abilBg, this.abilIcon, this.abilText]);

    this.help = txt(this, 0, 0, 'ลากนกถอยหลังแล้วปล่อยเพื่อยิง  ·  ลากพื้นที่ว่างเพื่อเลื่อนกล้อง  ·  แตะจอ/Space ระหว่างบิน = ใช้พลังนก', 17, '#ffffff', { weight: 400, stroke: '#0b1d3a', st: 4 })
      .setOrigin(0.5, 1).setAlpha(0.9);
    this.showBanner();
  }

  layout() {
    const w = this.scale.width, h = this.scale.height, s = uiScale(w, h), m = 14 * s;
    this.s = s;
    if (this.tl) this.tl.setPosition(m, m).setScale(s);
    if (this.tr) {
      const portrait = h > w && (410 + this.trWidth) * s + 3 * m > w;
      this.tr.setPosition(w - m, portrait ? m + 112 * s : m).setScale(s);
    }
    if (this.abil) this.abil.setPosition(w / 2, m + (h > w ? 200 : 30) * s).setScale(s);
    if (this.help) this.help.setPosition(w / 2, h - 10 * s).setScale(s);
    if (this.menu) this.menu.setPosition(w / 2, h / 2).setScale(s);
    if (this.trMenu) this.trMenu.setPosition(w - m, m).setScale(s);
    if (this.banner) this.banner.setPosition(w / 2, h * 0.42).setScale(s);
    if (this.newBird) this.newBird.setPosition(w / 2, h * 0.3).setScale(s);
    if (this.modal) this.modal.box.setPosition(w / 2, h / 2).setScale(s * Math.min(1, (h / s) / 520));
  }

  setScore(v) {
    if (!this.scoreText) return;
    if (this.scoreTween) this.scoreTween.stop();
    const from = this.shownScore;
    this.scoreTween = this.tweens.addCounter({
      from, to: v, duration: 450,
      onUpdate: (tw) => { this.shownScore = tw.getValue(); this.scoreText.setText('คะแนน ' + fmt(this.shownScore)); },
    });
    this.tweens.add({ targets: this.scoreText, scale: { from: 1.12, to: 1 }, duration: 250 });
  }
  setPigs(n) {
    if (!this.pigText) return;
    this.pigText.setText(`× ${n}`);
    this.tweens.add({ targets: this.pigText, scale: { from: 1.35, to: 1 }, duration: 300, ease: 'Back.easeOut' });
  }
  hideHelp() { if (this.help && this.help.alpha > 0.5) this.tweens.add({ targets: this.help, alpha: 0.35, duration: 400 }); }

  setAbility(type, phase) {
    if (!this.abil) return;
    const T = type && BIRD_TYPES[type];
    if (!T || !T.ability) { this.abil.setVisible(false); this.tweens.killTweensOf(this.abil); return; }
    const label = phase === 'flying' ? `แตะจอ หรือกด Space = ${T.verb}!` : `${T.name} · ระหว่างบินแตะจอเพื่อ${T.verb}`;
    this.abilIcon.setTexture(`bird_${type}`).setScale(0.62 / TEX);
    this.abilText.setText(label);
    const tw = this.abilText.width, W = tw + 76, H = 50;
    this.abilBg.clear(); glassPanel(this.abilBg, -W / 2, -H / 2, W, H, 25, 0.7);
    this.abilIcon.setPosition(-W / 2 + 30, 0);
    this.abilText.setPosition(-W / 2 + 56, 0);
    this.abil.setVisible(true).setAlpha(1);
    this.tweens.killTweensOf(this.abil);
    if (phase === 'flying') this.tweens.add({ targets: this.abil, alpha: 0.55, duration: 380, yoyo: true, repeat: -1 });
  }

  showBanner() {
    const gs = this.gs;
    const b = this.add.container().setDepth(20);
    b.add(txt(this, 0, -64, `ด่านที่ ${gs.levelIndex + 1}`, 66, '#ffd66b', { weight: 800, stroke: '#0b1d3a', st: 12, shadow: true }).setOrigin(0.5));
    b.add(txt(this, 0, 8, gs.level.name, 42, '#ffffff', { weight: 600, stroke: '#0b1d3a', st: 9 }).setOrigin(0.5));
    b.add(txt(this, 0, 62, `กำจัดหมูโจร ${gs.pigs.length} ตัว  ·  นก ${gs.level.birds.length} ตัว`, 24, '#e8f4ff', { weight: 600, stroke: '#0b1d3a', st: 6 }).setOrigin(0.5));
    const n = gs.level.birds.length;
    gs.level.birds.forEach((t, i) => b.add(img(this, (i - (n - 1) / 2) * 50, 112, `bird_${t}`).setScale(0.8 / TEX)));
    this.banner = b;
    this.layout();
    b.setAlpha(0);
    this.tweens.add({ targets: b, alpha: 1, duration: 300, yoyo: true, hold: 1500, onComplete: () => { b.destroy(); if (this.banner === b) this.banner = null; } });
  }

  showNewBird(type) {
    const T = BIRD_TYPES[type];
    if (this.newBird) this.newBird.destroy();
    const c = this.add.container().setDepth(25);
    const g = this.add.graphics(); glassPanel(g, -300, -72, 600, 144, 24, 0.82);
    c.add(g);
    const icon = img(this, -228, 0, `bird_${type}`).setScale(1.7 / TEX);
    c.add(icon);
    c.add(txt(this, -170, -30, `นกใหม่!  ${T.name}`, 32, '#ffd66b', { weight: 800 }).setOrigin(0, 0.5));
    c.add(txt(this, -170, 18, T.info, 20, '#ffffff', { weight: 400, align: 'left', wordWrap: true }).setOrigin(0, 0.5).setWordWrapWidth(440));
    this.newBird = c;
    this.layout();
    c.setAlpha(0);
    this.tweens.add({ targets: c, alpha: 1, y: c.y + 10, duration: 350, ease: 'Back.easeOut' });
    this.tweens.add({ targets: icon, angle: { from: -10, to: 10 }, duration: 420, yoyo: true, repeat: 5 });
    Sfx.play('newbird');
    this.time.delayedCall(4200, () => { if (this.newBird === c) this.tweens.add({ targets: c, alpha: 0, duration: 300, onComplete: () => { c.destroy(); if (this.newBird === c) this.newBird = null; } }); });
  }

  // ───── ป๊อปอัปกลางจอ ─────
  openModal(title, color, w = 660, h = 470) {
    this.closeModal();
    const overlay = this.add.rectangle(0, 0, 40000, 40000, 0x061430, 0.5).setInteractive().setDepth(50);
    const box = this.add.container().setDepth(51);
    const g = this.add.graphics(); glassPanel(g, -w / 2, -h / 2, w, h, 30, 0.9);
    box.add(g);
    if (title) box.add(txt(this, 0, -h / 2 + 58, title, 52, color, { weight: 800, stroke: '#061430', st: 10, shadow: true }).setOrigin(0.5));
    this.modal = { overlay, box };
    this.layout();
    const s = box.scale;
    box.setAlpha(0).setScale(s * 0.8);
    this.tweens.add({ targets: box, alpha: 1, scale: s, duration: 320, ease: 'Back.easeOut' });
    return box;
  }
  closeModal() {
    if (!this.modal) return;
    this.modal.overlay.destroy(); this.modal.box.destroy(); this.modal = null;
  }
  addClose(box, w, h, cb) {
    const b = makeIconButton(this, w / 2 - 34, -h / 2 + 34, 'close', cb);
    box.add(b);
  }

  togglePause() {
    const gs = this.gs;
    if (this.mode !== 'game' || gs.resultShown) return;
    if (gs.paused) { this.closeModal(); gs.setPaused(false); return; }
    gs.setPaused(true);
    const box = this.openModal('หยุดชั่วคราว', '#ffd66b', 560, 420);
    box.add(makeButton(this, 0, -30, 'เล่นต่อ', () => this.togglePause(), { w: 300, color: 0x2b8a3e }));
    box.add(makeButton(this, 0, 60, 'เริ่มด่านนี้ใหม่', () => gs.restartLevel(), { w: 300, color: 0x31507e }));
    box.add(makeButton(this, 0, 150, 'ออกเกมกลับหน้าหลัก', () => { location.href = 'index.html'; }, { w: 300, color: 0x31507e }));
  }

  showResult(r) {
    const gs = this.gs;
    if (this.abil) this.abil.setVisible(false);
    if (r.win) {
      const box = this.openModal(r.last ? 'ชนะครบทุกด่าน!' : 'ผ่านด่าน!', '#ffd66b');
      for (let i = 0; i < 3; i++) {
        const g = this.add.graphics();
        drawStar(g, 0, 0, 44, i < r.stars);
        g.setPosition((i - 1) * 108, -76 + (i === 1 ? -12 : 0));
        box.add(g);
        if (i < r.stars) {
          g.setScale(0);
          this.tweens.add({ targets: g, scale: 1, duration: 380, delay: 300 + i * 280, ease: 'Back.easeOut', onStart: () => Sfx.play('bonus') });
        }
      }
      const sc = txt(this, 0, 22, 'คะแนน 0', 34, '#ffffff', { weight: 800 }).setOrigin(0.5);
      box.add(sc);
      this.tweens.addCounter({ from: 0, to: r.score, duration: 900, delay: 250, onUpdate: (tw) => sc.setText('คะแนน ' + fmt(tw.getValue())) });
      const bt = txt(this, 0, 68, r.isNew ? 'สถิติใหม่!' : `สถิติ ${fmt(r.best)}`, r.isNew ? 26 : 22, r.isNew ? '#ffd66b' : '#bcd6ff', { weight: r.isNew ? 800 : 400 }).setOrigin(0.5);
      box.add(bt);
      if (r.isNew) this.tweens.add({ targets: bt, scale: { from: 0.9, to: 1.1 }, duration: 500, yoyo: true, repeat: -1 });
      box.add(makeButton(this, -210, 158, 'ออกเกม', () => { location.href = 'index.html'; }, { w: 180, color: 0x31507e, size: 23 }));
      box.add(makeButton(this, 0, 158, 'เล่นซ้ำ', () => gs.restartLevel(), { w: 180, color: 0x31507e, size: 23 }));
      if (r.last) box.add(makeButton(this, 210, 158, 'เมนูหลัก', () => gs.goMenu(false), { w: 180, color: 0x2b8a3e, size: 23 }));
      else box.add(makeButton(this, 210, 158, 'ด่านถัดไป »', () => gs.nextLevel(), { w: 180, color: 0x2b8a3e, size: 23 }));
    } else {
      const box = this.openModal('หมูโจรยังเหลือ!', '#ff9a9a');
      const smug = img(this, 0, -84, Tex.pig(this, 'normal', 'base')).setScale(1.4 / TEX);
      box.add(smug);
      this.tweens.add({ targets: smug, angle: { from: -9, to: 9 }, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      box.add(txt(this, 0, 4, `เหลืออีก ${r.pigsLeft} ตัว · นกหมดแล้ว`, 30, '#ffffff', { weight: 600 }).setOrigin(0.5));
      box.add(txt(this, 0, 52, `คะแนน ${fmt(r.score)}`, 24, '#cfe3ff').setOrigin(0.5));
      box.add(makeButton(this, -120, 158, 'ออกเกม', () => { location.href = 'index.html'; }, { w: 200, color: 0x31507e, size: 23 }));
      box.add(makeButton(this, 120, 158, 'ลองอีกครั้ง', () => gs.restartLevel(), { w: 220, color: 0xc0392b, size: 23 }));
    }
  }

  // ───── เมนูหลัก ─────
  buildMenu() {
    const gs = this.gs;
    this.menu = this.add.container();
    const title = txt(this, 0, -200, 'ถล่มป้อมหมูโจร', 104, '#ffd66b', { weight: 800, stroke: '#0b1d3a', st: 18, shadow: true }).setOrigin(0.5);
    this.menu.add(title);
    this.tweens.add({ targets: title, y: -210, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.menu.add(txt(this, 0, -112, 'เกมหนังสติ๊กยิงนก · ฟิสิกส์จริงด้วย Phaser 3 + Matter.js', 24, '#ffffff', { weight: 600, stroke: '#0b1d3a', st: 6 }).setOrigin(0.5));
    const sg = this.add.graphics(); drawStar(sg, 0, 0, 17, true);
    const stars = txt(this, 0, 0, `${Save.name()}  ·  ${Save.totalStars()} / ${LEVELS.length * 3}   ·   คะแนนรวม ${fmt(Save.totalScore())}`, 24, '#ffffff', { weight: 600, stroke: '#0b1d3a', st: 6 }).setOrigin(0, 0.5);
    const rowW = 40 + stars.width;
    sg.setPosition(-rowW / 2 + 17, -52); stars.setPosition(-rowW / 2 + 42, -52);
    this.menu.add([sg, stars]);
    const next = Save.nextLevel();
    const label = Save.totalStars() ? `เล่นต่อ · ด่าน ${next + 1}` : 'เริ่มเล่น';
    this.menu.add(makeButton(this, 0, 50, label, () => gs.playLevel(next), { w: 340, h: 82, size: 34, color: 0x2b8a3e }));
    this.menu.add(makeButton(this, 0, 150, 'เลือกด่าน', () => this.showLevelSelect(), { w: 280, h: 66, size: 26, color: 0x31507e }));
    this.trMenu = this.topRightButtons(['exit', 'fs', 'sound']);
    this.help = txt(this, 0, 0, 'F = เต็มจอ  ·  M = เปิด/ปิดเสียง  ·  Enter = เล่น', 17, '#ffffff', { stroke: '#0b1d3a', st: 4 }).setOrigin(0.5, 1).setAlpha(0.85);
  }

  showLevelSelect() {
    const W = 800, Hh = 520;
    const box = this.openModal('เลือกด่าน', '#ffd66b', W, Hh);
    this.addClose(box, W, Hh, () => this.closeModal());
    LEVELS.forEach((L, i) => {
      const col = i % 5, row = Math.floor(i / 5);
      const x = (col - 2) * 146, y = -52 + row * 168;
      const locked = i >= Save.unlocked(), best = Save.best(i);
      const c = this.add.container(x, y);
      const g = this.add.graphics();
      g.fillStyle(0x000000, 0.2).fillRoundedRect(-60, -56, 120, 132, 18);
      g.fillStyle(locked ? 0x22314f : 0x2b5aa0, 1).fillRoundedRect(-62, -62, 124, 132, 18);
      g.fillStyle(0xffffff, locked ? 0.05 : 0.14).fillRoundedRect(-58, -58, 116, 48, { tl: 14, tr: 14, bl: 6, br: 6 });
      g.lineStyle(3, locked ? 0x51607d : GOLD, 1).strokeRoundedRect(-62, -62, 124, 132, 18);
      c.add(g);
      if (locked) {
        const lk = this.add.graphics();
        lk.lineStyle(5, 0x8b9ab8, 1).beginPath(); lk.arc(0, -8, 12, Math.PI, 0); lk.strokePath();
        lk.fillStyle(0x8b9ab8, 1).fillRoundedRect(-18, -8, 36, 28, 5);
        lk.fillStyle(0x22314f, 1).fillCircle(0, 4, 4);
        c.add(lk);
      } else {
        c.add(txt(this, 0, -16, String(i + 1), 50, '#ffffff', { weight: 800, stroke: '#0b1d3a', st: 6 }).setOrigin(0.5));
        const sg = this.add.graphics();
        for (let k = 0; k < 3; k++) drawStar(sg, (k - 1) * 30, 40, 12, k < best.stars);
        c.add(sg);
        const z = this.add.zone(0, 4, 124, 132).setInteractive({ useHandCursor: true });
        z.on('pointerover', () => c.setScale(1.06));
        z.on('pointerout', () => c.setScale(1));
        z.on('pointerup', () => { Sfx.play('click'); this.gs.playLevel(i); });
        c.add(z);
      }
      c.add(txt(this, 0, 92, L.name, 18, locked ? '#8b9ab8' : '#e8f4ff', { weight: 600 }).setOrigin(0.5));
      box.add(c);
    });
  }
}

// ═══════════════════════════ เริ่มเกม ═══════════════════════════
function start() {
  Save.load();
  const startGame = () => {
  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: Math.round(window.innerWidth * DPR),
    height: Math.round(window.innerHeight * DPR),
    transparent: true,
    scale: { mode: Phaser.Scale.NONE, zoom: 1 / DPR },
    render: { antialias: true, powerPreference: 'high-performance' },
    input: { activePointers: 2 },
    physics: {
      default: 'matter',
      matter: {
        gravity: { y: 1 },
        enableSleeping: true,       // ตึกที่นิ่งแล้วจะ "หลับ" → ไม่สั่น ไม่ไหลเอง
        positionIterations: 10,
        velocityIterations: 8,
        autoUpdate: false,          // เดินฟิสิกส์เองแบบ fixed timestep
        debug: false,
      },
    },
    scene: [BootScene, TitleScene, GameScene, UIScene],
  });
  window.game = game;
  const fit = () => game.scale.resize(Math.round(window.innerWidth * DPR), Math.round(window.innerHeight * DPR));
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 300));
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 80));
  document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 80));
  window.addEventListener('keydown', (e) => { if ((e.key === 'f' || e.key === 'F') && !e.repeat) FS.toggle(); });
  };
  if (Save.data.active) startGame();
  else { ProfileGate.onReady = startGame; ProfileGate.showIfNeeded(); }
}
// รอฟอนต์ไทยโหลดก่อนวาดข้อความบน canvas — ออฟไลน์/ช้าเกิน 2.5 วิ ใช้ฟอนต์สำรอง
const fontsReady = document.fonts
  ? Promise.all(['400 20px Kanit', '600 20px Kanit', '800 20px Kanit'].map((f) => document.fonts.load(f, 'ทดสอบ')))
  : Promise.resolve();
Promise.race([fontsReady, new Promise((r) => setTimeout(r, 2500))]).catch(() => {}).then(start);
})();
</script>
